name: Build fork image

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: twenty-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Private self-hosted runners (gh-runner-01/02-us-east-1-twenty)
    runs-on: [self-hosted, us-east-1]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Disk before build
        run: df -h /

      - name: Image tag
        id: ver
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/stackblaze/twenty:latest
            ghcr.io/stackblaze/twenty:sha-${{ steps.ver.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/stackblaze/twenty
          build-args: |
            APP_VERSION=0.2.1

      - name: Disk after build
        if: always()
        run: df -h /
